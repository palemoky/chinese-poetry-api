server:
  port: 1279
  mode: release  # debug, release, test
  # Proxies allowed to set X-Forwarded-For (IPs or CIDRs). Requests from any other
  # address are identified by their TCP peer, so clients can't spoof their IP to
  # dodge the rate limiter. Defaults to loopback + private ranges when omitted;
  # override with TRUSTED_PROXIES (comma-separated, or "none").
  # trusted_proxies: ["127.0.0.1/32", "172.16.0.0/12"]

database:
  # SQLite file holding both the simplified and traditional tables.
  # Defaults to data/poetry.db (the volume mounted in docker-compose); override with DB_PATH.
  # path: data/poetry.db
  # Connection pool settings (0 = auto-detect based on CPU cores)
  # Auto-detection: max_open_conns = min(NumCPU, 50), max_idle_conns = max_open_conns/2
  # Manual override: set to specific values (e.g., 10, 20)
  max_open_conns: 0  # 0 = auto (recommended), or set manually
  max_idle_conns: 0  # 0 = auto (recommended), or set manually

rate_limit:
  enabled: true
  requests_per_second: 10
  burst: 20

graphql:
  playground: false  # Enable GraphQL Playground (set to true for development)
  introspection: true
  # Max query complexity; paginated fields count as child cost x pageSize
  complexity_limit: 5000

search:
  max_results: 1000
  default_page_size: 20

semantic:
  # Optional semantic search ("poems about missing home", English descriptions, half-remembered
  # lines). Enabled only when both the vector file and an embedding API are available.
  # Vector file released next to poetry.db; override with VECTORS_PATH.
  # vectors_path: data/poetry-vectors.db
  # OpenAI-compatible embeddings API, e.g. a local Ollama with `ollama pull bge-m3`.
  # Override with EMBEDDING_API_URL. The API key, if any, is read from EMBEDDING_API_KEY only.
  # embedding_url: http://localhost:11434/v1
  # Model name at that API; defaults to the model recorded in the vector file. It must be the same
  # model, possibly under another name (e.g. BAAI/bge-m3). Override with EMBEDDING_MODEL.
  # embedding_model: bge-m3
